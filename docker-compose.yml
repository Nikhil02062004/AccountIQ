services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: accountiq-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/accountiq.db
      - BACKEND_CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - DEFAULT_LLM_MODEL=${DEFAULT_LLM_MODEL:-gemini-1.5-flash}
      - DATA_RETENTION_DAYS=${DATA_RETENTION_DAYS:-90}
      - ALLOW_CONTACT_DELETION=${ALLOW_CONTACT_DELETION:-true}
    volumes:
      - accountiq_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
    container_name: accountiq-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
      - PORT=3000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  accountiq_data:
    driver: local
